# Stub policy for the Road Trip Adventure (SLES-51356) recompile. Names only (public PS2 SDK/libc symbols),
# no addresses or disc-derived data. Applied to the generated recompiler config by
# game/tools/apply_stub_policy.py after the analyzer/Ghidra merge, so regenerating work/rta.toml
# can never bring back the wrong HLE stubs (see CHANGELOG 2026-10-07 and HANDOFF section 7).

# Functions that must run as the GAME'S OWN recompiled code, never as an HLE stub.
# Each entry is here because its stub was proven wrong or inexact against the guest code.
run_as_game_code = [
  # libc / SDK pure-computation stubs -> the game's own code (track H audit, 2026-10-08).
  # cos: newlib DOUBLE cos (soft-float, a0->v0); the game's callers pass f12 and read f0
  # (a prototype mismatch in the game itself). On a PS2, f0 is left unchanged (0.0); the host
  # stub returned cosf(f12). Proven with game/tests/oracle/run_call.ts. The rest are
  # frame-identical on boot/race/newgame (track H gate c2nocos).
  "cos",
  "memclr",
  "memcmp",
  "memcpy",
  "memmove",
  "memset",
  "memchr",
  "strcat",
  "strcmp",
  "strcpy",
  "strlen",
  "strncpy",
  "vsprintf",
  "_mbtowc_r",
  "__divdi3",
  "sceDmaGetChan",
  "sceGifPkCloseGifTag",
